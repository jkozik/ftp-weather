---
# weewxrtlsdr FTP Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftp-weewxrtlsdr
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ftp-weewxrtlsdr
  template:
    metadata:
      labels:
        app: ftp-weewxrtlsdr
    spec:
      containers:
      - name: vsftpd
        image: fauria/vsftpd:latest
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
            ephemeral-storage: 100M
          limits:
            cpu: 500m
            memory: 256Mi
            ephemeral-storage: 200M
        ports:
        - containerPort: 20
          name: ftp-data
        - containerPort: 21
          name: ftp-control
        - containerPort: 31400
          name: pasv-min
        - containerPort: 31410
          name: pasv-max
        env:
        - name: FTP_USER
          value: "weewxrtlsdr"
        - name: FTP_PASS
          valueFrom:
            secretKeyRef:
              name: ftp-passwords
              key: weewxrtlsdr-password
        - name: PASV_ADDRESS
          value: "192.168.100.208"
        - name: PASV_MIN_PORT
          value: "31400"
        - name: PASV_MAX_PORT
          value: "31410"
        - name: FILE_OPEN_MODE
          value: "0644"
        - name: LOCAL_UMASK
          value: "022"
        volumeMounts:
        - name: ftp-data
          mountPath: /home/vsftpd/weewxrtlsdr
          subPath: weewxrtlsdr
        securityContext:
          capabilities:
            add:
              - NET_BIND_SERVICE
      volumes:
      - name: ftp-data
        persistentVolumeClaim:
          claimName: weather-ftp-pvc

---
# weewxrtlsdr FTP Service
apiVersion: v1
kind: Service
metadata:
  name: ftp-weewxrtlsdr
  namespace: default
spec:
  type: NodePort
  selector:
    app: ftp-weewxrtlsdr
  ports:
  - name: ftp-data
    port: 20
    targetPort: 20
    nodePort: 30420
    protocol: TCP
  - name: ftp-control
    port: 21
    targetPort: 21
    nodePort: 30421
    protocol: TCP
  - name: pasv-1
    port: 31400
    targetPort: 31400
    nodePort: 31400
    protocol: TCP
  - name: pasv-2
    port: 31401
    targetPort: 31401
    nodePort: 31401
    protocol: TCP
  - name: pasv-3
    port: 31402
    targetPort: 31402
    nodePort: 31402
    protocol: TCP
  - name: pasv-4
    port: 31403
    targetPort: 31403
    nodePort: 31403
    protocol: TCP
  - name: pasv-5
    port: 31404
    targetPort: 31404
    nodePort: 31404
    protocol: TCP
  - name: pasv-6
    port: 31405
    targetPort: 31405
    nodePort: 31405
    protocol: TCP
  - name: pasv-7
    port: 31406
    targetPort: 31406
    nodePort: 31406
    protocol: TCP
  - name: pasv-8
    port: 31407
    targetPort: 31407
    nodePort: 31407
    protocol: TCP
  - name: pasv-9
    port: 31408
    targetPort: 31408
    nodePort: 31408
    protocol: TCP
  - name: pasv-10
    port: 31409
    targetPort: 31409
    nodePort: 31409
    protocol: TCP
  - name: pasv-11
    port: 31410
    targetPort: 31410
    nodePort: 31410
    protocol: TCP
